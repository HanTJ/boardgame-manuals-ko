<!doctype html>

<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="보드게임 한국어 매뉴얼 홈">

    <span class="header-note">비공식 팬 번역</span>

  <main class="catalog-shell">
    <section class="catalog-intro" aria-labelledby="catalog-title">
      <p class="eyebrow">KOREAN RULEBOOK ARCHIVE</p>
      <h1 id="catalog-title">게임은 빠르게,<br>규칙은 정확하게.</h1>
      <p>공식 규칙서를 기준으로 핵심 흐름과 예외를 한국어로 정리합니다. 게임별 페이지는 모바일 열람과 인쇄를 모두 지원합니다.</p>
    </section>

    <section class="manual-list" aria-labelledby="manual-list-title">
      <div class="section-heading-row">
        <h2 id="manual-list-title">등록된 매뉴얼</h2>
        <span class="count-badge">1개</span>
      </div>
      <a class="manual-row" href="./games/tacoloco/">
        <div class="manual-number" aria-hidden="true">01</div>
        <div class="manual-copy">
          <p class="manual-meta">2–5명 · 15분 · 7세 이상</p>
          <h3>Tacoloco</h3>
          <p>합계 11을 만드는 가볍고 매콤한 카드 게임</p>
        </div>
        <span class="manual-arrow" aria-hidden="true">→</span>
      </a>
    </section>

  <footer class="site-footer">
    <p>각 게임의 권리는 원저작자와 출판사에 있습니다.</p>
    <p>오역 제보와 새 매뉴얼은 GitHub에서 관리합니다.</p>
  </footer>
